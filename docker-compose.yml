services:
  edge-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./maps:/app/maps:ro
      - ./datasets:/app/datasets:ro

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_EDGE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - edge-engine

